name: Java CI/CD Pipeline with Maven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: "Deploy to EC2 after confirming the host is reachable on SSH"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build and test with Maven
        run: ./mvnw -B clean verify

      - name: Archive production JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-petclinic-jar
          path: target/spring-petclinic-*.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_ec2 }}
    steps:
      - name: Download JAR from build job
        uses: actions/download-artifact@v4
        with:
          name: spring-petclinic-jar
          path: target

      - name: Validate EC2 deployment settings
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" || { echo "::error::EC2_HOST secret is missing."; exit 1; }
          test -n "$EC2_PRIVATE_KEY" || { echo "::error::EC2_PRIVATE_KEY secret is missing."; exit 1; }

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY }}

      - name: Verify EC2 SSH connectivity and install runtime
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ec2-user@${{ secrets.EC2_HOST }} \
            "sudo dnf install -y java-17-amazon-corretto-headless psmisc"

      - name: Stop existing application
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ec2-user@${{ secrets.EC2_HOST }} \
            "sudo fuser -k 8080/tcp || true"

      - name: Copy JAR to EC2
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new target/spring-petclinic-*.jar \
            ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/

      - name: Start Spring PetClinic
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ec2-user@${{ secrets.EC2_HOST }} \
            "nohup java -jar /home/ec2-user/spring-petclinic-*.jar > /home/ec2-user/petclinic.log 2>&1 < /dev/null &"
